name: Set up shared restaurant lists
on:
  push:
    branches: [main]
    paths:
      - 'supabase/food.sql'
      - 'scripts/setup-food.js'
      - '.github/workflows/food.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install shared restaurant list
        run: node scripts/setup-food.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
