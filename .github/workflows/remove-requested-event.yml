name: Remove requested old event
on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-requested-event.sql'
      - 'scripts/remove-requested-event.js'
permissions:
  contents: read
concurrency:
  group: requested-event-cleanup
  cancel-in-progress: false
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove only the uniquely matching requested event
        run: node scripts/remove-requested-event.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
